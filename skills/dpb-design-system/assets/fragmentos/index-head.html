<!--
    Fragmento de index.html: se FUSIONA con el que crea Vite, no lo reemplaza. Cada bloque dice
    dónde va y qué sustituye. Lo demás (charset, viewport, el body) se queda igual.
-->

<!-- En la etiqueta <html>: la app está en español. Vite trae lang="en". -->
<html lang="es">

<!-- Dentro de <head>, en lugar del favicon de Vite (/favicon.svg): el isotipo DPB de public/marca/. -->
<link rel="icon" type="image/svg+xml" href="/marca/dpb-isotipo.svg" />

<!-- Dentro de <head>: el azul DPB (#2C589A, brand-600 en la escala del paquete) en la barra del navegador. -->
<meta name="theme-color" content="#2C589A" />

<!-- Dentro de <head>: Inter, la fuente del tema del paquete, que no la carga por su cuenta.
     El 500 es `font-medium`, que usan las plantillas: sin él se pinta en 400. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />

<!-- Dentro de <head>: la descripción y el título de la app. El título lleva el mismo nombre que SHELL.nombreApp. -->
<meta name="description" content="Qué hace la app — Desarrollos Palo Blanco" />
<title>Nombre de la app — Palo Blanco</title>

<!-- Al FINAL de <head>: corre antes del primer pintado, así el tema guardado no parpadea al cargar. -->
<script>
    // Inline en `head` para evitar el parpadeo de tema (FOUC) al cargar.
    //
    // La clave TIENE que ser la misma que usa ThemeProvider ("ui-theme"); el
    // starter de Untitled UI leía aquí "theme" y el guardia nunca coincidía.
    //
    // Sin valor guardado el tema es CLARO, igual que `defaultTheme="light"` en
    // main.tsx. Son apps administrativas que se usan junto a hojas de cálculo y
    // documentos impresos: el claro es el modo esperado.
    try {
        var stored = localStorage.getItem("ui-theme");
        var isDark = stored === "dark" || (stored === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark-mode", isDark);
    } catch (e) {
        // localStorage bloqueado (incógnito, cookies deshabilitadas): tema claro.
        document.documentElement.classList.remove("dark-mode");
    }
</script>
